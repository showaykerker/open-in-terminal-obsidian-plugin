name: Build and Release

on:
  push:
    tags:
      - '*'
      - '*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and attach assets to (e.g. 0.10.0)'
        required: true
        default: '0.10.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build plugin
        run: npm run build

      - name: Prepare release assets
        id: prep
        run: |
          mkdir -p release
          cp manifest.json main.js release/
          if [ -f styles.css ]; then cp styles.css release/; fi
          cd release
          zip -r ../open-in-terminal.zip .
          cd ..
          {
            echo 'files<<EOF'
            echo 'manifest.json'
            echo 'main.js'
            echo 'open-in-terminal.zip'
            if [ -f styles.css ]; then echo 'styles.css'; fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: ${{ steps.prep.outputs.files }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
